<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Sistema Firebase</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="login-container">
    <h2>Criar Nova Conta</h2>
    <form id="register-form">
      <label for="email">E-mail:</label>
      <input type="email" id="email" placeholder="exemplo@email.com" required>
      
      <label for="password">Senha (mínimo 6 caracteres):</label>
      <input type="password" id="password" placeholder="Crie uma senha forte" required>
      
      <button type="submit">Cadastrar</button>
    </form>
    <p>Já possui uma conta? <a href="index.html">Faça login</a></p>
  </div>


  <!-- Firebase SDK v8 (Compatibility UMD) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="./register.js"></script>
</body>
</html>
